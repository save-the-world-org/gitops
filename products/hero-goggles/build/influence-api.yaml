# hero-goggles's kpack Image, scaffolded by Infrared. Builds https://github.com/save-the-world-org/influence-api at its default
# branch with Paketo buildpacks (auto: they find the stack in the repo's code) and pushes 10.110.0.50:5000/save-the-world-org/hero-goggles-influence-api. kpack rebuilds on
# every push; Releases tag a build's digest vX.Y.Z.
apiVersion: kpack.io/v1alpha2
kind: Image
metadata:
  name: hero-goggles-influence-api
  namespace: builds-save-the-world-org
  labels:
    infrared.darkshift.io/product: hero-goggles
spec:
  build:
    # Where the build runs: the install's placement.builds. Infrared rewrites the lines up to the end of it.
    nodeSelector:
      infrared.darkshift.io/pool: tenants
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
    runtimeClassName: gvisor
    tolerations:
    - effect: NoSchedule
      key: infrared.darkshift.io/tenants
      operator: Equal
      value: "true"
    # End of the install's placement.builds.
  tag: 10.110.0.50:5000/save-the-world-org/hero-goggles-influence-api:main
  serviceAccountName: builder
  builder:
    kind: ClusterBuilder
    name: infrared-builder
  source:
    git:
      url: https://github.com/save-the-world-org/influence-api
      revision: main
  # kpack's cache, in the registry beside the image: a cache volume would
  # tie the Image to one node's disk.
  cache:
    registry:
      tag: 10.110.0.50:5000/save-the-world-org/hero-goggles-influence-api:cache
  successBuildHistoryLimit: 10
  failedBuildHistoryLimit: 5
