# hero-goggles's kpack Image, scaffolded by Infrared. Builds https://github.com/save-the-world-org/hero-goggles at its default
# branch with Paketo buildpacks (static) and pushes 10.110.0.50:5000/save-the-world-org/hero-goggles. kpack rebuilds on
# every push; Releases tag a build's digest vX.Y.Z.
apiVersion: kpack.io/v1alpha2
kind: Image
metadata:
  name: hero-goggles
  namespace: builds-save-the-world-org
  labels:
    infrared.darkshift.io/product: hero-goggles
spec:
  tag: 10.110.0.50:5000/save-the-world-org/hero-goggles:main
  serviceAccountName: builder
  builder:
    kind: ClusterBuilder
    name: infrared-builder
  source:
    git:
      url: https://github.com/save-the-world-org/hero-goggles
      revision: main
  build:
    # Where the build runs: the install's placement.builds. Infrared rewrites the lines up to the end of it.
    nodeSelector:
      infrared.darkshift.io/pool: tenants
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
    runtimeClassName: gvisor
    tolerations:
    - effect: NoSchedule
      key: infrared.darkshift.io/tenants
      operator: Equal
      value: "true"
    # End of the install's placement.builds.
    env:
      # Serve the files with nginx (Paketo web-servers buildpack).
      - name: BP_WEB_SERVER
        value: nginx
      - name: BP_WEB_SERVER_ROOT
        value: "dist"
      - name: BP_NODE_RUN_SCRIPTS
        value: build
  # kpack's cache, in the registry beside the image: a cache volume would
  # tie the Image to one node's disk.
  cache:
    registry:
      tag: 10.110.0.50:5000/save-the-world-org/hero-goggles:cache
  successBuildHistoryLimit: 10
  failedBuildHistoryLimit: 5
