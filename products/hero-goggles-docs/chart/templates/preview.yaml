{{- if .Values.preview.host }}
# The zone's route on the platform's Gateway. Every Gateway API default is
# written out (the parentRef's group and kind, the PathPrefix / match, the
# backendRef's group, kind and weight): Argo CD compares what the API server
# stores with this file, and a default left out would keep the zone OutOfSync,
# so no Release would promote. The zone's address needs no DNS record of its
# own: the platform's wildcard record covers it. Its other addresses outside
# the platform domain attach through the zone's ListenerSet, and Infrared
# gives each its DNS record once it serves.
#
# Browsers must never keep a stale page: static files carry a 1980 timestamp
# (reproducible builds), so their ETag and Last-Modified don't change when an
# edit keeps a file's size. Drop both and don't let browsers store pages.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-preview
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    # Who may open the zone: sign-in, or public. Infrared reads it for the zone's links.
    infrared.darkshift.io/access: {{ if .Values.preview.public }}public{{ else }}sign-in{{ end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
    {{- if and .Values.preview.listenerSet .Values.preview.hosts }}
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ .Values.preview.listenerSet }}
      namespace: {{ .Values.gateway.namespace }}
    {{- end }}
  hostnames:
    - {{ .Values.preview.host | quote }}
    {{- range .Values.preview.hosts }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
            remove:
              - ETag
              - Last-Modified
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}
          port: 80
          weight: 1
{{- if and .Values.preview.redirects .Values.preview.canonical }}
---
# The zone's redirect addresses send visitors to its canonical address: a
# permanent redirect that keeps the path. On the zone's ListenerSet when it
# has one (addresses outside the platform domain), else on the Gateway's
# listener. Open to anyone: it serves nothing but the redirect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-redirect
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  parentRefs:
    {{- if .Values.preview.listenerSet }}
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ .Values.preview.listenerSet }}
      namespace: {{ .Values.gateway.namespace }}
    {{- else }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
    {{- end }}
  hostnames:
    {{- range .Values.preview.redirects }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ .Values.preview.canonical | quote }}
            scheme: https
            statusCode: 301
{{- end }}
{{- if not .Values.preview.public }}
---
# Visitors must be signed in to Infrared: Envoy asks Infrared's API before
# every request (ext auth), at authPath followed by the request's own path,
# with its method, its Host and its cookies. Only a 200 lets the request
# through; the API's redirect to sign in, with the cookie it sets, goes back to
# the browser. If the API cannot answer, Envoy refuses the request. Infrared
# writes the ReferenceGrant that lets this zone's namespace reach the API.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Release.Name }}-preview-auth
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Release.Name }}-preview
  extAuth:
    failOpen: false
    headersToExtAuth:
      - cookie
    http:
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.preview.authService }}
          namespace: {{ .Values.preview.authNamespace }}
          port: {{ .Values.preview.authPort }}
          weight: 1
      path: {{ .Values.preview.authPath | quote }}
{{- end }}
{{- end }}
