# Zone influence-api-production (Release) of influence-api, scaffolded by Infrared. Releases pin image.* here.
zone: influence-api-production
image:
  repository: 10.110.0.50:5000/save-the-world-org/influence-api
  tag: ""
  digest: ""
preview:
  host: "influence-api-production.darkshift.cloud"
  authService: "infrared-api"
  authNamespace: "infrared"
  authPort: 8080
  authPath: "/v1/auth/preview/envoy"
  public: false
tenancy:
  automountServiceAccountToken: false
  nodeSelector:
    infrared.darkshift.io/pool: tenants
  runtimeClassName: gvisor
  tolerations:
  - effect: NoSchedule
    key: infrared.darkshift.io/tenants
    operator: Equal
    value: "true"
