# Zone influence-production (Release) of influence, scaffolded by Infrared. Releases pin image.* here.
zone: influence-production
image:
  repository: 10.110.0.50:5000/save-the-world-org/influence
  tag: ""
  digest: ""
preview:
  host: "influence.darkshift.cloud"
  authService: ""
  authNamespace: ""
  authPort: 0
  authPath: ""
  public: true
tenancy:
  automountServiceAccountToken: false
  nodeSelector:
    infrared.darkshift.io/pool: tenants
  runtimeClassName: gvisor
  tolerations:
  - effect: NoSchedule
    key: infrared.darkshift.io/tenants
    operator: Equal
    value: "true"
